# =============================================================================
# Sync vendored shared packages into consumer service repos
# =============================================================================
# Canonical sources here -> vendored copies in consumers:
#   integration/  -> <repo>/integration/
#   smsly-core/   -> <repo>/_vendor/smsly-core/
#
# Consumers (add new services by extending the matrix):
#   - SMSLYCLOUD/smsly-security-gateway (main)
#   - SMSLYCLOUD/smsly-platform-api     (master)
#   - SMSLYCLOUD/smsly-identity-service (master)
#
# SETUP (one-time) — GitHub App auth (no personal tokens involved):
#   1. Org Settings -> Developer settings -> GitHub Apps -> New GitHub App
#      - Name: smsly-vendored-sync (or similar)
#      - Homepage URL: https://github.com/SMSLYCLOUD/smsly-shared
#      - Webhook: disabled (not needed)
#      - Repository permissions: Contents -> Read and write
#   2. On the app page: note the App ID, then "Generate a private key"
#      (downloads a .pem file)
#   3. Install the app on the org -> "Only select repositories" ->
#      the three consumer repos listed above
#   4. This repo -> Settings -> Secrets and variables -> Actions:
#      - APP_ID           = the App ID number
#      - APP_PRIVATE_KEY  = full contents of the downloaded .pem
#
# Pushing to consumer repos triggers their own CI/CD (Grid auto-deploy).
# =============================================================================

name: Sync vendored packages

on:
  push:
    branches: [master]
    paths:
      - "integration/**"
      - "smsly-core/**"
  schedule:
    - cron: "0 3 * * 1" # weekly drift repair (fixes hand-edits in vendored copies)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-vendored-packages
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - repo: smsly-security-gateway
            branch: main
          - repo: smsly-platform-api
            branch: master
          - repo: smsly-identity-service
            branch: master
    steps:
      - name: Checkout shared packages
        uses: actions/checkout@v4

      - name: Mint short-lived installation token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: SMSLYCLOUD
          repositories: ${{ matrix.repo }}

      - name: Sync packages into ${{ matrix.repo }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::Failed to mint installation token. Check APP_ID / APP_PRIVATE_KEY secrets and that the GitHub App is installed on ${{ matrix.repo }}."
            exit 1
          fi

          git clone --depth 1 --branch "${{ matrix.branch }}" \
            "https://x-access-token:${GH_TOKEN}@github.com/SMSLYCLOUD/${{ matrix.repo }}.git" consumer

          mirror() {
            mkdir -p "consumer/$2"
            rsync -a --delete \
              --exclude '__pycache__/' \
              --exclude '.ruff_cache/' \
              --exclude '.pytest_cache/' \
              "$1/" "consumer/$2/"
          }

          mirror integration integration
          mirror smsly-core _vendor/smsly-core

          cd consumer
          BOT="${APP_SLUG:-smsly-shared-sync}[bot]"
          git config user.name  "${BOT}"
          git config user.email "${BOT}@users.noreply.github.com"

          SHORT_SHA="${SOURCE_SHA:0:7}"
          git add -A integration _vendor/smsly-core
          if git diff --cached --quiet; then
            echo "::notice::${{ matrix.repo }} already up to date with smsly-shared@${SHORT_SHA}"
            exit 0
          fi

          git commit -m "chore(sync): update vendored shared packages from smsly-shared@${SHORT_SHA}"

          pushed=0
          for attempt in 1 2 3; do
            if git push origin HEAD:"${{ matrix.branch }}"; then
              echo "::notice::Synced shared packages to ${{ matrix.repo }} (from ${SHORT_SHA})"
              pushed=1
              break
            fi
            echo "::warning::Push attempt ${attempt} failed, rebasing and retrying..."
            git pull --rebase origin "${{ matrix.branch }}" || true
          done

          if [ "${pushed}" -ne 1 ]; then
            echo "::error::Failed to push sync commit to ${{ matrix.repo }} after 3 attempts."
            exit 1
          fi
